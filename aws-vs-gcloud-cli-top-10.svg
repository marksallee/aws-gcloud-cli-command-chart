<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
  <style>
    .title { font: 700 62px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
    .subtitle { font: 400 27px Arial, Helvetica, sans-serif; fill: #b7c7df; }
    .th { font: 700 25px Arial, Helvetica, sans-serif; fill: #eef5ff; letter-spacing: 1px; }
    .task { font: 700 25px Arial, Helvetica, sans-serif; fill: #16243d; }
    .code { font: 600 22px Consolas, "Courier New", monospace; fill: #1f2937; }
    .footer { font: 400 22px Arial, Helvetica, sans-serif; fill: #5e718c; }
  </style>
  <rect width="1600" height="2000" fill="#f4f8fd"/>
  <rect x="0" y="0" width="1600" height="355" fill="#10203a"/>
  <circle cx="1450" cy="78" r="280" fill="#16375d" opacity=".8"/>
  <circle cx="1320" cy="330" r="190" fill="#1a4a75" opacity=".6"/>
  <text x="100" y="130" class="title">AWS CLI  ↔  gcloud CLI</text>
  <text x="100" y="190" class="subtitle">Top 10 command mappings for cloud &amp; platform engineers</text>
  <rect x="100" y="245" width="223" height="52" rx="26" fill="#ff9900"/>
  <text x="128" y="280" class="th" fill="#16243d">AWS</text>
  <rect x="340" y="245" width="261" height="52" rx="26" fill="#4285f4"/>
  <text x="368" y="280" class="th">GOOGLE CLOUD</text>

  <rect x="70" y="400" width="1460" height="1180" rx="24" fill="#ffffff" stroke="#dbe6f3" stroke-width="3"/>
  <rect x="70" y="400" width="1460" height="82" rx="24" fill="#1d3557"/>
  <rect x="70" y="458" width="1460" height="24" fill="#1d3557"/>
  <text x="112" y="452" class="th">TASK</text>
  <text x="510" y="452" class="th">AWS CLI</text>
  <text x="1040" y="452" class="th">GCLOUD CLI</text>
  <line x1="460" y1="400" x2="460" y2="1580" stroke="#dbe6f3" stroke-width="2"/>
  <line x1="990" y1="400" x2="990" y2="1580" stroke="#dbe6f3" stroke-width="2"/>

  <g>
    <rect x="71" y="482" width="1458" height="110" fill="#f7fbff"/>
    <text x="112" y="548" class="task">Configure credentials</text><text x="500" y="548" class="code">aws configure</text><text x="1030" y="548" class="code">gcloud auth login</text>
    <rect x="71" y="702" width="1458" height="110" fill="#f7fbff"/>
    <text x="112" y="768" class="task">Set account / project</text><text x="500" y="768" class="code">aws configure set profile prod</text><text x="1030" y="768" class="code">gcloud config set project PROJECT_ID</text>
    <rect x="71" y="922" width="1458" height="110" fill="#f7fbff"/>
    <text x="112" y="988" class="task">Create a VM</text><text x="500" y="988" class="code">aws ec2 run-instances ...</text><text x="1030" y="988" class="code">gcloud compute instances create NAME ...</text>
    <rect x="71" y="1142" width="1458" height="110" fill="#f7fbff"/>
    <text x="112" y="1208" class="task">Copy to object storage</text><text x="500" y="1208" class="code">aws s3 cp app.zip s3://BUCKET/</text><text x="1030" y="1208" class="code">gcloud storage cp app.zip gs://BUCKET/</text>
    <rect x="71" y="1362" width="1458" height="110" fill="#f7fbff"/>
    <text x="112" y="1428" class="task">Get Kubernetes credentials</text><text x="500" y="1428" class="code">aws eks update-kubeconfig --name CLUSTER</text><text x="1030" y="1428" class="code">gcloud container clusters get-credentials CLUSTER</text>
  </g>
  <g>
    <text x="112" y="658" class="task">Show active identity</text><text x="500" y="658" class="code">aws sts get-caller-identity</text><text x="1030" y="658" class="code">gcloud auth list</text>
    <text x="112" y="878" class="task">List VM instances</text><text x="500" y="878" class="code">aws ec2 describe-instances</text><text x="1030" y="878" class="code">gcloud compute instances list</text>
    <text x="112" y="1098" class="task">List storage buckets</text><text x="500" y="1098" class="code">aws s3 ls</text><text x="1030" y="1098" class="code">gcloud storage buckets list</text>
    <text x="112" y="1318" class="task">List Kubernetes clusters</text><text x="500" y="1318" class="code">aws eks list-clusters</text><text x="1030" y="1318" class="code">gcloud container clusters list</text>
    <text x="112" y="1538" class="task">Inspect IAM</text><text x="500" y="1538" class="code">aws iam list-roles</text><text x="1030" y="1538" class="code">gcloud projects get-iam-policy PROJECT_ID</text>
  </g>
  <g stroke="#dbe6f3" stroke-width="2">
    <line x1="70" y1="592" x2="1530" y2="592"/><line x1="70" y1="702" x2="1530" y2="702"/><line x1="70" y1="812" x2="1530" y2="812"/><line x1="70" y1="922" x2="1530" y2="922"/><line x1="70" y1="1032" x2="1530" y2="1032"/><line x1="70" y1="1142" x2="1530" y2="1142"/><line x1="70" y1="1252" x2="1530" y2="1252"/><line x1="70" y1="1362" x2="1530" y2="1362"/><line x1="70" y1="1472" x2="1530" y2="1472"/>
  </g>
  <rect x="100" y="1650" width="1400" height="175" rx="22" fill="#e7f0fb"/>
  <text x="145" y="1721" class="task">Mental model</text>
  <text x="145" y="1780" class="footer">AWS: service + API action  •  gcloud: product + resource + verb</text>
  <text x="100" y="1925" class="footer">Save this reference • Share it with your cloud engineering network</text>
</svg>
